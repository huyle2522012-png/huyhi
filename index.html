<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Vocabulary</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7ff;--card:#fff;--ink:#0f1b33;--mut:#5d6b86;--pri:#2563eb;--pri2:#1e40af;--soft:#e6eeff;--line:#dbe5fa;--ok:#12a150;--bad:#d92d3a;--r:18px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px}
.brand{font-weight:700;font-size:18px;color:var(--pri2)}.brand span{color:var(--pri)}
nav{display:flex;gap:4px;margin:0 auto}nav button{border:0;background:none;padding:8px 14px;border-radius:12px;font:inherit;font-weight:500;color:var(--mut);cursor:pointer}
nav button.on{background:var(--soft);color:var(--pri2)}
main{max-width:920px;margin:0 auto;padding:22px 16px}
h1{font-size:30px;line-height:1.2;margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}h3{margin:0 0 6px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:0 6px 24px rgba(37,99,235,.06)}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:24px;padding:28px;margin-bottom:16px}.hero p{opacity:.9;max-width:520px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}.stat b{display:block;font-size:28px;color:var(--pri2)}.stat span{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 16px;border-radius:12px;font:inherit;font-weight:500;cursor:pointer;display:inline-block;transition:transform .12s,background .12s}
.btn:hover{background:var(--soft)}.btn:active{transform:scale(.97)}.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri2)}
.hero .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}.hero .btn.pri{background:#fff;color:var(--pri2)}
.btn.bad{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}.btn[disabled]{opacity:.5;pointer-events:none}
.ico{border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:14px}
input,select,textarea{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
label.l{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}.f2{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.w{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}.w:last-child{border:0}
.ipa{color:var(--pri);margin:0 6px}.ex{color:var(--mut);font-size:13px}.tag{background:var(--soft);color:var(--pri2);border-radius:8px;padding:1px 8px;font-size:12px;margin-left:4px}
.known b{color:var(--ok)}.empty{text-align:center;color:var(--mut);padding:26px}
.ov{position:fixed;inset:0;background:rgba(15,27,51,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.sheet{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.fc{perspective:1000px;margin:10px auto;max-width:480px;height:300px;cursor:pointer}
.fi{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,1.35,.5,1);transform-style:preserve-3d}.fc.flip .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 14px 36px rgba(37,99,235,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:6px;overflow:auto}
.face.bk{transform:rotateY(180deg)}.big{font-size:34px;font-weight:700;color:var(--pri2)}
.ok{color:var(--ok)}.no{color:var(--bad)}.msg{padding:12px;border-radius:12px;margin:12px 0}.msg.ok{background:#e7f8ee}.msg.no{background:#fdecee}
.bars{display:flex;gap:10px;align-items:flex-end;height:150px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mut)}.bars i{display:block;background:var(--pri);border-radius:8px 8px 0 0;min-height:3px;margin-bottom:4px}
.prev{max-width:100%;max-height:260px;border-radius:14px;display:block;margin:12px 0}.itm{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
pre{background:#0f1b33;color:#cfe0ff;padding:12px;border-radius:12px;overflow:auto;font-size:12px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}#toast.on{opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}.msg{animation:pop .25s ease-out}.msg.no{animation:shk .35s}.fc{animation:pop .3s ease-out}.itm{animation:pop .25s ease-out}
@media(max-width:720px){nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);margin:0;padding:6px;justify-content:space-around;z-index:6}nav button{padding:8px 6px;font-size:12px}.f2{grid-template-columns:1fr}h1{font-size:25px}header{padding:10px 14px}.sp.h{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.brand span{background:linear-gradient(90deg,#2563eb,#a855f7,#ec4899,#f59e0b,#2563eb);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brand 6s linear infinite}@keyframes brand{to{background-position:200% 0}}
nav button.on{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.35)}
.btn.pri{background:linear-gradient(135deg,#2563eb,#7c3aed);border-color:transparent}.btn.pri:hover{background:linear-gradient(135deg,#1d4ed8,#6d28d9);transform:translateY(-1px)}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;min-height:230px;background:linear-gradient(120deg,#2563eb,#7c3aed,#ec4899,#f59e0b);background-size:300% 300%;animation:herobg 12s ease-in-out infinite}@keyframes herobg{50%{background-position:100% 50%}}
.hero .btn.pri:hover{background:#fff7ed}.ht{position:relative;z-index:2;flex:1}.art{position:relative;flex:0 0 42%;height:200px}
.fcard{position:absolute;background:#fff;color:#1e40af;border-radius:14px;padding:8px 14px;font-weight:700;box-shadow:0 10px 26px rgba(15,27,51,.28);animation:flt 5s ease-in-out infinite}.fcard small{display:block;color:#7c3aed;font-weight:500;font-size:11px}
@keyframes flt{50%{transform:translateY(-14px) rotate(var(--r))}}
.rk{position:absolute;font-size:34px;animation:fly 7s linear infinite}@keyframes fly{from{left:-10%;top:90%;transform:rotate(45deg)}to{left:105%;top:-15%;transform:rotate(45deg)}}
.pl{position:absolute;right:6%;top:4%;font-size:40px;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.twk{position:absolute;color:#fff;font-style:normal;animation:twk 2.4s ease-in-out infinite}@keyframes twk{50%{opacity:.15;transform:scale(.5)}}
.stat{transition:transform .2s,box-shadow .2s}.stat:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(124,58,237,.18)}
.stat b{background:linear-gradient(135deg,#2563eb,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid .stat:nth-child(4n+1){background:linear-gradient(135deg,#e0ecff,#fff)}.grid .stat:nth-child(4n+2){background:linear-gradient(135deg,#ede9fe,#fff)}.grid .stat:nth-child(4n+3){background:linear-gradient(135deg,#fce7f3,#fff)}.grid .stat:nth-child(4n){background:linear-gradient(135deg,#fef3c7,#fff)}
.bars i{background:linear-gradient(180deg,#ec4899,#7c3aed 45%,#2563eb);transform-origin:bottom;animation:grow .8s ease-out}@keyframes grow{from{transform:scaleY(0)}}
.big{background:linear-gradient(90deg,#2563eb,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.face{background:linear-gradient(160deg,#fff,#eef4ff)}.face.bk{background:linear-gradient(160deg,#fff7ed,#fdf2f8)}.msg.ok{background:linear-gradient(90deg,#d1fae5,#ecfeff)}
.cf{position:fixed;top:40%;width:8px;height:12px;border-radius:2px;z-index:40;pointer-events:none;animation:cf 1.2s ease-out forwards}@keyframes cf{to{transform:translate(var(--dx),260px) rotate(540deg);opacity:0}}
@media(max-width:720px){.hero{flex-direction:column;align-items:stretch}.art{flex:none;width:100%;height:150px}}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.th{position:relative}.th img{width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--line);animation:pop .25s ease-out}
.th .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--bad);color:#fff;cursor:pointer;line-height:1}
.ck{width:auto;margin-right:6px;accent-color:#7c3aed}.selbar{padding:8px 0;border-bottom:1px solid var(--line);position:sticky;top:56px;background:#fff;z-index:2}
.rt small{display:block;font-weight:400;font-size:11px;color:var(--mut)}.rt b{color:#7c3aed}mark{background:#fde68a;border-radius:4px;padding:0 2px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt b{display:inline-block;width:22px;color:#7c3aed}.opt.good{background:#d1fae5;border-color:#10b981}.opt.bad{background:#fee2e2;border-color:#ef4444}.opt[disabled]{opacity:1}
#ail{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;overflow:hidden;color:#fff;background:radial-gradient(circle at 50% 38%,rgba(91,33,182,.95),rgba(22,12,64,.98));opacity:0;pointer-events:none;transition:opacity .35s}
#ail.on{opacity:1;pointer-events:auto}#ail h2{margin:0;font-size:21px;text-align:center}#ail p{margin:0;opacity:.78;max-width:460px;text-align:center}
#ail .btn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);margin-top:6px}
.orbw{position:relative;width:270px;height:270px;display:flex;align-items:center;justify-content:center}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#c4b5fd 18%,#8b5cf6 52%,#4f46e5 100%);box-shadow:0 0 60px 20px rgba(139,92,246,.55),0 0 130px 50px rgba(236,72,153,.28);animation:orb 3s ease-in-out infinite}
.ring{position:absolute;border-radius:50%;border:2px dashed rgba(244,114,182,.85)}.r1{inset:4px;animation:rs 10s linear infinite}.r2{inset:42px;border-color:rgba(255,255,255,.55);animation:rs 7s linear infinite reverse}
.r3{inset:0;border:2px solid rgba(167,139,250,.7);animation:pulse 2.4s ease-out infinite}
@keyframes orb{50%{transform:scale(1.09)}}@keyframes rs{to{transform:rotate(360deg)}}@keyframes pulse{from{transform:scale(.55);opacity:.9}to{transform:scale(1.3);opacity:0}}
.pbar{width:260px;height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}.pbar i{display:block;height:100%;width:30%;border-radius:6px;background:linear-gradient(90deg,#60a5fa,#a855f7,#ec4899);animation:ind 1.4s ease-in-out infinite}
.pbar i.det{animation:none;transition:width .5s}@keyframes ind{from{margin-left:-30%}to{margin-left:100%}}
.pt{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:rgba(196,181,253,.8);animation:up 7s linear infinite}@keyframes up{to{transform:translateY(-110vh);opacity:0}}

/* ---- Google account ---- */
#acct{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
#acct img{width:22px;height:22px;border-radius:50%;object-fit:cover}
#acct.sync{opacity:.7}
@media(max-width:720px){#acct .nm{display:none}}

/* ---- Hiệu ứng động (chỉ thêm giao diện, không đổi chức năng) ---- */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes drift{to{transform:translate(4%,3%) rotate(6deg) scale(1.1)}}
@keyframes rip{from{transform:scale(0);opacity:.45}to{transform:scale(1);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(124,58,237,.45)}50%{box-shadow:0 0 0 8px rgba(124,58,237,0)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetIn{from{opacity:0;transform:translateY(24px) scale(.94)}}
@keyframes okp{40%{transform:scale(1.03);box-shadow:0 0 0 6px rgba(16,185,129,.25)}}
header{transition:box-shadow .3s}header.sc{box-shadow:0 8px 30px rgba(76,29,149,.14)}
.brand{transition:transform .3s cubic-bezier(.3,1.6,.5,1);cursor:default}.brand:hover{transform:scale(1.07) rotate(-2deg)}
nav button{transition:background .25s,color .25s,transform .2s}nav button:not(.on):hover{background:var(--soft);color:var(--pri2);transform:translateY(-2px)}
nav button.on{animation:pop .35s ease-out}
.btn{position:relative;overflow:hidden;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{box-shadow:0 6px 16px rgba(76,29,149,.16)}
.btn.pri::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-110%);pointer-events:none}
.btn.pri:hover::after{transform:translateX(110%);transition:transform .65s}
.rip{position:absolute;border-radius:50%;background:rgba(124,58,237,.35);pointer-events:none;animation:rip .6s ease-out forwards}
.btn.pri .rip,.hero .rip{background:rgba(255,255,255,.5)}
#acct.pri{animation:glow 2.8s ease-in-out infinite}
.ico{transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s}.ico:hover{transform:scale(1.18) rotate(-8deg);background:#ddd6fe}.ico:active{transform:scale(.9)}
.card{transition:box-shadow .3s,border-color .3s}.card:hover{box-shadow:0 12px 34px rgba(124,58,237,.14);border-color:#c4b5fd}
.itm{transition:transform .2s,box-shadow .2s,border-color .2s}.itm:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,.12);border-color:#c4b5fd}
.w{transition:background .25s}.w:hover{background:linear-gradient(90deg,rgba(124,58,237,.07),transparent)}
input,select,textarea{transition:border-color .2s,box-shadow .2s}input:focus,select:focus,textarea:focus{border-color:#a78bfa;box-shadow:0 0 0 4px rgba(124,58,237,.14)}
.hero::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(280px circle at var(--mx,72%) var(--my,25%),rgba(255,255,255,.24),transparent 62%)}
.art{transform:translate(calc(var(--px,0)*16px),calc(var(--py,0)*10px));transition:transform .25s ease-out}
.opt{transition:transform .15s,background .2s,border-color .2s}.opt:not([disabled]):hover{transform:translateX(4px)}
.opt.good{animation:okp .5s ease-out}.opt.bad{animation:shk .35s}
.ov{animation:fadeIn .2s ease-out;backdrop-filter:blur(4px)}.sheet{animation:sheetIn .38s cubic-bezier(.2,1.2,.3,1)}
#toast{transform:translate(-50%,16px);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}#toast.on{transform:translate(-50%,0)}
#app.enter>*:not(.hero):not(.grid),#app.enter .stat,#app.enter .itm,#app.enter .w:nth-child(-n+10){animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
#app.enter>.hero{animation:herobg 12s ease-in-out infinite,rise .65s cubic-bezier(.2,.8,.2,1) backwards}
#app.enter .ht>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:.18s}#app.enter .ht>*:nth-child(2){animation-delay:.28s}#app.enter .ht>*:nth-child(3){animation-delay:.38s}
#app.enter>*:nth-child(2){animation-delay:0.12s}#app.enter>*:nth-child(3){animation-delay:0.18s}#app.enter>*:nth-child(4){animation-delay:0.24s}#app.enter>*:nth-child(5){animation-delay:0.30s}#app.enter>*:nth-child(6){animation-delay:0.36s}#app.enter>*:nth-child(7){animation-delay:0.42s}#app.enter .stat:nth-child(1){animation-delay:0.18s}#app.enter .stat:nth-child(2){animation-delay:0.24s}#app.enter .stat:nth-child(3){animation-delay:0.30s}#app.enter .stat:nth-child(4){animation-delay:0.36s}#app.enter .stat:nth-child(5){animation-delay:0.42s}#app.enter .stat:nth-child(6){animation-delay:0.48s}#app.enter .stat:nth-child(7){animation-delay:0.54s}#app.enter .stat:nth-child(8){animation-delay:0.60s}#app.enter .w:nth-child(1){animation-delay:0.12s}#app.enter .w:nth-child(2){animation-delay:0.16s}#app.enter .w:nth-child(3){animation-delay:0.20s}#app.enter .w:nth-child(4){animation-delay:0.24s}#app.enter .w:nth-child(5){animation-delay:0.28s}#app.enter .w:nth-child(6){animation-delay:0.32s}#app.enter .w:nth-child(7){animation-delay:0.36s}#app.enter .w:nth-child(8){animation-delay:0.40s}#app.enter .w:nth-child(9){animation-delay:0.44s}#app.enter .w:nth-child(10){animation-delay:0.48s}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#a78bfa,#60a5fa);border-radius:10px;border:2px solid transparent;background-clip:content-box}
@media(prefers-reduced-motion:reduce){body::before,.btn::after,.rip,.hero::before,#acct{animation:none!important;transition:none!important}}

/* ---- Nền động theo chế độ (nhẹ: chỉ transform/opacity) ---- */
#bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sc{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s,visibility 0s .7s;overflow:hidden}
.sc.on{opacity:1;visibility:visible;transition:opacity .7s}
.sc i{display:block;position:absolute;font-style:normal;animation-play-state:paused}.sc.on i{animation-play-state:running;will-change:transform,opacity}
.s-home{background:linear-gradient(160deg,#f3f7ff,#f6f1ff)}.s-decks{background:linear-gradient(160deg,#fff8ee,#fdf1f7)}.s-scan{background:linear-gradient(160deg,#effbff,#eef4ff)}.s-stats{background:linear-gradient(160deg,#effcf6,#eef3ff)}.s-practice{background:linear-gradient(160deg,#f1f2ff,#f8f0ff)}.s-card{background:linear-gradient(160deg,#f6f0ff,#fff0f6)}.s-type{background:linear-gradient(160deg,#eef5ff,#eaf1ff)}.s-mc{background:linear-gradient(160deg,#ecfdf5,#effcf8)}.s-cloze{background:linear-gradient(160deg,#fff6ee,#fff1f3)}.s-game{background:linear-gradient(160deg,#fbf0ff,#f3efff)}
.s-home .bl{left:var(--x);top:var(--y);width:60vmax;height:60vmax;background:radial-gradient(circle,var(--c),transparent 65%);animation:bgBlob var(--d) ease-in-out infinite alternate}
.tw{left:var(--x);top:var(--y);font-size:var(--s);color:var(--c);animation:bgTw var(--d) ease-in-out var(--t) infinite}
.s-decks i{left:var(--x);top:var(--y);width:var(--s);height:calc(var(--s)*1.35);border:2px solid var(--c);border-radius:12px;background:linear-gradient(160deg,rgba(255,255,255,.65),rgba(255,255,255,.1));animation:bgBob var(--d) ease-in-out var(--t) infinite alternate}
.s-scan{background-image:linear-gradient(rgba(6,182,212,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,.08) 1px,transparent 1px),linear-gradient(160deg,#effbff,#eef4ff);background-size:48px 48px,48px 48px,100% 100%}
.s-scan .bm{left:0;right:0;top:-150px;height:150px;background:linear-gradient(180deg,transparent,rgba(6,182,212,.16) 70%,rgba(20,184,166,.55) 98%,transparent);animation:bgScan 4.8s linear infinite}
.s-scan .cn{width:46px;height:46px;border:3px solid rgba(6,182,212,.6);animation:bgPulse 2.4s ease-in-out infinite}
.s-scan .c1{left:9vw;top:18vh;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.s-scan .c2{right:9vw;top:18vh;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.s-scan .c3{left:9vw;bottom:16vh;border-right:0;border-top:0;border-radius:0 0 0 10px}.s-scan .c4{right:9vw;bottom:16vh;border-left:0;border-top:0;border-radius:0 0 10px 0}
.s-stats i{left:var(--x);bottom:0;width:5vw;height:42vh;transform-origin:bottom;background:linear-gradient(180deg,var(--c),transparent);border-radius:10px 10px 0 0;animation:bgBar var(--d) ease-in-out var(--t) infinite alternate}
.s-practice i{left:50%;top:50%;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border:2px dashed var(--c);border-radius:50%;animation:bgRot var(--d) linear infinite}
.s-practice i::after{content:'';position:absolute;top:-7px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--c)}
.s-type i{left:var(--x);top:-12%;font-size:var(--s);font-weight:700;color:var(--c);animation:bgFall var(--d) linear var(--t) infinite}
.s-mc i{left:var(--x);bottom:-130px;width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--c);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),transparent 45%);animation:bgRise var(--d) ease-in var(--t) infinite}
.s-cloze i{left:0;top:var(--y);width:var(--s);height:7px;border-radius:7px;background:var(--c);animation:bgSlide var(--d) linear var(--t) infinite}
.s-game i{left:var(--x);top:var(--y);width:130px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c));animation:bgMeteor var(--d) linear var(--t) infinite}
@keyframes bgBlob{to{transform:translate(var(--dx),var(--dy)) scale(1.25)}}
@keyframes bgTw{0%,100%{opacity:.1;transform:scale(.6) rotate(0)}50%{opacity:.85;transform:scale(1.2) rotate(25deg)}}
@keyframes bgBob{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-28px) rotate(var(--r2))}}
@keyframes bgScan{to{transform:translateY(calc(100vh + 150px))}}
@keyframes bgPulse{50%{opacity:.35;transform:scale(1.07)}}
@keyframes bgBar{from{transform:scaleY(.12)}to{transform:scaleY(var(--h))}}
@keyframes bgRot{to{transform:rotate(360deg)}}
@keyframes bgFall{from{transform:translateY(0) rotate(-12deg)}to{transform:translateY(125vh) rotate(12deg)}}
@keyframes bgRise{0%{transform:translate(0,0)}50%{transform:translate(var(--sw),-60vh)}100%{transform:translate(0,-135vh)}}
@keyframes bgSlide{from{transform:translateX(-320px)}to{transform:translateX(calc(100vw + 320px))}}
@keyframes bgMeteor{from{transform:translate(0,0) rotate(35deg);opacity:0}10%{opacity:1}to{transform:translate(90vmax,63vmax) rotate(35deg);opacity:0}}
/* ---- Giảm lag: bỏ blur, banner chạy bằng transform ---- */
header{backdrop-filter:none;background:rgba(255,255,255,.95)}.ov{backdrop-filter:none}.card{background:rgba(255,255,255,.88);backdrop-filter:none}
.hero{isolation:isolate;background:#7c3aed;animation:none}
.hero::after{content:'';position:absolute;left:0;top:0;bottom:0;width:300%;z-index:-1;background:linear-gradient(90deg,#2563eb,#7c3aed,#ec4899,#f59e0b,#ec4899,#7c3aed,#2563eb);will-change:transform;animation:heroMove 18s ease-in-out infinite alternate}
@keyframes heroMove{to{transform:translateX(-66.6%)}}
#app.enter>.hero{animation:rise .65s cubic-bezier(.2,.8,.2,1) backwards}
.hero::before{inset:auto;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;background:radial-gradient(circle,rgba(255,255,255,.26),transparent 62%);transform:translate(var(--mx,620px),var(--my,60px));will-change:transform}
@media(prefers-reduced-motion:reduce){.hero::after{animation:none!important}}
</style>

<body>
<header><div class="brand">Smart<span>Vocab</span></div>
<nav><button data-act="go" data-v="home" data-nav="home">Trang chủ</button><button data-act="go" data-v="decks" data-nav="decks">Bộ từ vựng</button><button data-act="go" data-v="scan" data-nav="scan">Quét ảnh</button><button data-act="go" data-v="practice" data-nav="practice">Luyện tập</button><button data-act="go" data-v="stats" data-nav="stats">Thống kê</button></nav>
<button class="btn sm pri" id="acct" title="Đăng nhập để lưu dữ liệu lên tài khoản Google">Đăng nhập Google</button><button class="btn sm" id="snd" data-act="snd" title="Bật/tắt âm thanh">🔊</button><button class="btn sm" data-act="settings" title="Cấu hình AI">⚙ AI</button></header>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4)}
const KEY='smartvocab_v1',LV=['A1','A2','B1','B2','C1'];
const PROMPT='You are an OCR assistant for English learners. Read the image and extract ONLY the English vocabulary items that actually appear in it (words or short phrases), with the Vietnamese meaning if it is written in the image. Never invent words that are not in the image. If a Vietnamese meaning is missing, add a concise one. Fill in ipa, pos (noun, verb, adjective...), a short, SIMPLE example sentence (ex) whose difficulty matches the CEFR level of the word (A1-A2 words: 5-9 words, everyday context, nothing harder than the target word; never an academic or formal sentence) and its Vietnamese translation (exVi) when missing. Return ONLY a JSON array of objects: [{"en":"","vi":"","ipa":"","pos":"","ex":"","exVi":""}]. If there is no vocabulary, return [].';
const WORKER=`export default{async fetch(req,env){
 const cors={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'Content-Type'};
 if(req.method==='OPTIONS')return new Response(null,{headers:cors});
 const {image,mime,prompt}=await req.json();
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':env.GEMINI_KEY},body:JSON.stringify({contents:[{parts:[{text:prompt},...(image?[{inline_data:{mime_type:mime,data:image}}]:[])]}],generationConfig:{responseMimeType:'application/json'}})});
 const j=await r.json();
 return new Response(JSON.stringify({text:j.candidates?.[0]?.content?.parts?.[0]?.text||''}),{headers:{...cors,'Content-Type':'application/json'}})}}`;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.decks)return d}catch(e){}
 return{decks:[{id:uid(),name:'Bộ từ vựng của tôi',words:[]}],log:{},set:{mode:'gemini',key:'',model:'gemini-2.0-flash',proxy:''}}}
let D=load();
let S={sel:new Set(),selMode:false,view:'home',deck:null,q:'',lvl:'',scan:{imgs:[],items:null,busy:false,err:''},P:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));localStorage.setItem('smartvocab_dirty','1')}catch(e){toast('Không lưu được dữ liệu (bộ nhớ đầy?)')}
 try{window.cloudPush&&window.cloudPush()}catch(e){}}
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms||2600)}
const allW=()=>D.decks.flatMap(d=>d.words);
function findW(id){for(const d of D.decks){const w=d.words.find(x=>x.id===id);if(w)return{w,d}}}
const dstr=k=>new Date(Date.now()-k*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mk(o){return{id:uid(),en:(o.en||'').trim(),vi:(o.vi||'').trim(),ipa:(o.ipa||'').trim(),pos:(o.pos||'').trim(),ex:(o.ex||'').trim(),exVi:(o.exVi||'').trim(),level:o.level||'',known:!!o.known,acc:Array.isArray(o.acc)?o.acc.map(x=>String(x).trim()).filter(Boolean):[]}}
function logP(id,ok){const t=D.log[dstr(0)]||(D.log[dstr(0)]={n:0,c:0,ids:[]});if(ok!==undefined){t.n++;if(ok)t.c++;const f=findW(id);if(f){const st=f.w.st||(f.w.st={c:0,x:0,lw:false});ok?st.c++:st.x++;st.lw=!ok}}if(!t.ids.includes(id))t.ids.push(id);save()}
function stopSay(){say.k=(say.k||0)+1;if('speechSynthesis' in window)speechSynthesis.cancel()}
function say(t){if(!('speechSynthesis' in window))return toast('Trình duyệt này không hỗ trợ đọc văn bản (Web Speech API). Hãy dùng Chrome, Edge hoặc Safari.');stopSay();const id=say.k,u=new SpeechSynthesisUtterance(t);const acc=D.set.accent==='UK'?'en-GB':'en-US',vs=enVoices(),ex=vs.filter(v=>vLang(v)===acc);u.lang=acc;u.rate=D.set.rate||.92;u.voice=ex.find(v=>v.name===D.set.voice)||ex.find(v=>/Google|Natural|Online|Samantha|Daniel|Aria|Jenny/i.test(v.name))||ex[0]||vs[0]||null;if(!ex.length&&!say.w){say.w=1;toast('Máy chưa có giọng '+(acc==='en-GB'?'UK':'US')+' — dùng giọng tiếng Anh khác')}setTimeout(()=>{if(say.k===id)speechSynthesis.speak(u)},40)}
const spk=t=>`<button class="ico" data-act="say" data-t="${esc(t)}" aria-label="Phát âm">🔊</button>`;
const lvSel=(id,v,all)=>`<select id="${id}">${all?'<option value="">'+all+'</option>':'<option value="">Chưa chọn</option>'}${LV.map(l=>`<option ${l===v?'selected':''}>${l}</option>`).join('')}</select>`;

/* ---------- Views ---------- */
function render(){stopSay();if(document.activeElement&&document.activeElement.tagName==='BUTTON')document.activeElement.blur();document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===S.view));
 $('#app').innerHTML={home:vHome,decks:vDecks,scan:vScan,practice:vPractice,stats:vStats}[S.view]();$('#ans')?.focus();countUp();{const sb=$('#snd');if(sb)sb.textContent=D.set.snd===false?'🔇':'🔊'}const P=S.P;if(P&&S.view==='practice'){if(P.say){P.say=false;const w=P.mode==='card'?P.list[P.i]:(P.mode==='en-vi'||P.mode==='mc')?P.queue[P.i]:null;if(w&&D.set.auto!==false)say(w.en)}if(P.mode==='game'&&$('#gc'))initGame()}}
function counts(){const w=allW(),k=w.filter(x=>x.known).length,t=D.log[dstr(0)];return{total:w.length,k,u:w.length-k,today:t?t.ids.length:0,n:t?t.n:0}}
function vHome(){const c=counts(),s=D.set,ready=s.mode==='proxy'?s.proxy:s.key;
 return `<section class="hero"><div class="art" aria-hidden="true"><span class="pl">🪐</span><span class="fcard" style="left:4%;top:8%;--r:-6deg">vocabulary<small>từ vựng</small></span><span class="fcard" style="left:38%;top:40%;--r:5deg;animation-delay:-1.7s">mitigate<small>giảm nhẹ</small></span><span class="fcard" style="left:6%;top:62%;--r:-3deg;animation-delay:-3.2s">river<small>dòng sông</small></span><span class="rk">🚀</span><i class="twk" style="left:30%;top:6%">✦</i><i class="twk" style="left:70%;top:55%;animation-delay:-.8s">✦</i><i class="twk" style="left:86%;top:80%;animation-delay:-1.5s">✧</i></div><div class="ht"><h1>Chụp trang sách,<br>có ngay bộ flashcard.</h1><p>Quét ảnh vở ghi chép hoặc danh sách từ, chỉnh lại kết quả rồi lưu. Luyện gõ và lật thẻ mỗi ngày.</p><div class="row"><button class="btn pri" data-act="go" data-v="scan">Quét ảnh</button><button class="btn" data-act="go" data-v="practice">Luyện tập</button><button class="btn" data-act="go" data-v="decks">Bộ từ vựng</button></div></div></section>
 <div class="grid"><div class="stat"><b data-n="${c.total}">${c.total}</b><span>Từ đã lưu</span></div><div class="stat"><b data-n="${c.k}">${c.k}</b><span>Đã thuộc</span></div><div class="stat"><b data-n="${c.u}">${c.u}</b><span>Chưa thuộc</span></div><div class="stat"><b data-n="${c.today}">${c.today}</b><span>Luyện hôm nay</span></div></div>
 <div class="card"><div class="row"><div class="sp"><h3>Ôn tập hôm nay</h3><span class="ex">${dueN()} từ đến hạn · ${newN()} từ mới · chuỗi ${streak()} ngày 🔥</span></div><button class="btn pri" data-act="quick" data-sc="due">Ôn ngay</button><button class="btn" data-act="quick" data-sc="weak">Ôn từ yếu</button></div></div>
 ${ready?'':'<div class="card"><h3>Chưa cấu hình AI</h3><p>Chức năng quét ảnh cần API key (hoặc proxy của bạn). Các chức năng khác vẫn dùng được bình thường.</p><button class="btn pri" data-act="settings">Cấu hình AI</button></div>'}`}

function vDecks(){
 if(S.deck){const d=D.decks.find(x=>x.id===S.deck);if(!d){S.deck=null;return vDecks()}
  return `<div class="row"><button class="btn" data-act="back">← Các bộ</button><h2 class="sp" style="margin:0">${esc(d.name)} (${d.words.length})</h2></div>
  <div class="card" style="margin-top:14px"><div class="row"><div class="sp" style="min-width:180px"><input id="q" placeholder="Tìm từ hoặc nghĩa…" value="${esc(S.q)}"></div><div style="width:130px">${lvSel('lvl',S.lvl,'Mọi trình độ')}</div><button class="btn pri" data-act="addw">+ Thêm từ</button><button class="btn" data-act="bulk">Dán hàng loạt</button><button class="btn" data-act="selmode">${S.selMode?'Xong':'Chọn nhiều'}</button></div><div id="wl">${wordList()}</div></div>`}
 return `<div class="card"><h2>Tạo bộ từ vựng</h2><div class="row"><div class="sp"><input id="newdeck" placeholder="Tên chủ đề, ví dụ: IELTS Environment"></div><button class="btn pri" data-act="newdeck">Tạo bộ</button></div></div>
 ${D.decks.map(d=>`<div class="card"><div class="row"><div class="sp"><h3>${esc(d.name)}</h3><span class="ex">${d.words.length} từ · ${d.words.filter(w=>w.known).length} đã thuộc</span></div><button class="btn pri sm" data-act="open" data-id="${d.id}">Mở</button><button class="btn sm" data-act="rename" data-id="${d.id}">Đổi tên</button><button class="btn sm bad" data-act="deldeck" data-id="${d.id}">Xóa</button></div></div>`).join('')}
 <div class="card"><h3>Sao lưu dữ liệu</h3><div class="row"><button class="btn" data-act="export">Xuất CSV</button><label class="btn">Nhập CSV<input id="f_csv" type="file" accept=".csv,text/csv" hidden></label></div></div>`}
function visW(){const d=D.decks.find(x=>x.id===S.deck),q=S.q.trim().toLowerCase();return d.words.filter(w=>(!S.lvl||w.level===S.lvl)&&(!q||(w.en+' '+w.vi).toLowerCase().includes(q)))}
function selBar(ws){return `<div class="row selbar"><label class="row" style="gap:6px"><input type="checkbox" class="ck" data-act="selall" ${ws.length&&ws.every(w=>S.sel.has(w.id))?'checked':''}>Chọn tất cả (${ws.length})</label><span class="sp"></span><button class="btn sm bad" data-act="delsel" ${S.sel.size?'':'disabled'}>Xóa ${S.sel.size} từ đã chọn</button></div>`}
function wordList(){const d=D.decks.find(x=>x.id===S.deck),q=S.q.trim().toLowerCase();
 const ws=d.words.filter(w=>(!S.lvl||w.level===S.lvl)&&(!q||(w.en+' '+w.vi).toLowerCase().includes(q)));
 if(!ws.length)return '<div class="empty">Chưa có từ nào phù hợp. Thêm từ thủ công, dán hàng loạt hoặc quét ảnh.</div>';
 return (S.selMode?selBar(ws):'')+ws.map(w=>`<div class="w ${w.known?'known':''}"><div><div class="row" style="gap:4px">${S.selMode?`<input type="checkbox" class="ck" data-id="${w.id}" ${S.sel.has(w.id)?'checked':''}>`:''}<b>${esc(w.en)}</b>${spk(w.en)}${w.ipa?`<span class="ipa">/${esc(w.ipa.replace(/\//g,''))}/</span>`:''}${w.pos?`<i class="ex">${esc(w.pos)}</i>`:''}${w.level?`<span class="tag">${w.level}</span>`:''}</div><div>${esc(w.vi)}</div>${w.ex?`<div class="ex">${esc(w.ex)} ${spk(w.ex)}<br>${esc(w.exVi)}</div>`:''}</div>
 <div class="row" style="flex-direction:column;align-items:stretch"><button class="btn sm" data-act="known" data-id="${w.id}">${w.known?'✓ Đã thuộc':'Chưa thuộc'}</button><button class="btn sm" data-act="editw" data-id="${w.id}">Sửa</button><button class="btn sm bad" data-act="delw" data-id="${w.id}">Xóa</button></div></div>`).join('')}

function vScan(){const s=S.scan,deckOpts=D.decks.map(d=>`<option value="${d.id}" ${d.id===S.deck?'selected':''}>${esc(d.name)}</option>`).join('');
 let h=`<div class="card"><h2>Quét ảnh tạo flashcard</h2><p class="ex">Chọn ảnh vở ghi chép, sách giáo khoa hoặc danh sách từ. AI chỉ lấy những từ xuất hiện trong ảnh. Bạn có thể chọn nhiều ảnh cùng lúc hoặc dán ảnh bằng Ctrl+V.</p><div class="row"><label class="btn pri">Tải ảnh lên<input id="f_img" type="file" accept="image/*" multiple hidden></label><label class="btn">Chụp bằng camera<input id="f_cam" type="file" accept="image/*" capture="environment" hidden></label><button class="btn" data-act="pasteimg">Dán ảnh</button></div>
 ${thumbsHtml(s)}
 ${s.err?`<div class="msg no">${esc(s.err)}</div>`:''}</div>`;
 if(s.items){h+=`<div class="card"><h2>Kết quả (${s.items.length} từ) — kiểm tra và chỉnh sửa</h2>${s.items.map((it,i)=>`<div class="itm"><div class="f2"><input data-si="${i}" data-f="en" placeholder="English" value="${esc(it.en)}"><input data-si="${i}" data-f="vi" placeholder="Nghĩa tiếng Việt" value="${esc(it.vi)}"><input data-si="${i}" data-f="ipa" placeholder="IPA" value="${esc(it.ipa)}"><input data-si="${i}" data-f="pos" placeholder="Loại từ" value="${esc(it.pos)}"><input data-si="${i}" data-f="ex" placeholder="Câu ví dụ" value="${esc(it.ex)}"><input data-si="${i}" data-f="exVi" placeholder="Dịch câu ví dụ" value="${esc(it.exVi)}"></div><button class="btn sm bad" style="margin-top:8px" data-act="delitem" data-i="${i}">Xóa từ này</button></div>`).join('')}
 <button class="btn" data-act="additem">+ Thêm từ</button>
 <div class="f2"><div><label class="l">Lưu vào bộ</label><select id="sdeck">${deckOpts}</select></div><div><label class="l">Hoặc tạo bộ mới</label><input id="sname" placeholder="Tên bộ mới (tùy chọn)"></div><div><label class="l">Trình độ</label>${lvSel('slvl','')}</div></div>
 <div class="row" style="margin-top:14px"><button class="btn pri" data-act="savescan">Xác nhận lưu tất cả</button><button class="btn" data-act="cancelscan">Hủy</button></div></div>`}
 return h}

function vPractice(){const P=S.P;if(!P){const ds=D.decks.map(d=>`<option value="${d.id}" ${d.id===S.deck?'selected':''}>${esc(d.name)} (${d.words.length})</option>`).join('');
  return `<div class="card"><h2>Ôn nhanh</h2><div class="row"><button class="btn pri" data-act="quick" data-sc="due">Đến hạn hôm nay (${dueN()}${newN()?' + '+Math.min(10,newN())+' mới':''})</button><button class="btn" data-act="quick" data-sc="weak">Từ sai / từ yếu (${allW().filter(isWeak).length})</button></div><p class="ex">Chế độ thẻ: Space lật · 1–4 chấm mức nhớ (Quên / Khó / Tốt / Dễ).</p></div>
  <div class="card"><h2>Chọn bài luyện tập</h2><div class="f2"><div><label class="l">Bộ từ</label><select id="pdeck"><option value="all">Tất cả các bộ</option>${ds}</select></div><div><label class="l">Phạm vi</label><select id="pscope"><option value="all">Tất cả từ</option><option value="unk">Chỉ từ chưa thuộc</option><option value="weak" ${S.pre==='weak'?'selected':''}>Chỉ từ yếu (hay sai)</option><option value="due" ${S.pre==='due'?'selected':''}>Đến hạn ôn hôm nay (SRS)</option></select></div></div><label class="row" style="margin-top:10px;gap:8px"><input type="checkbox" id="pauto" style="width:auto" ${D.set.auto!==false?'checked':''}> Tự động đọc từ khi chuyển thẻ / câu hỏi</label></div>
  <div class="grid"><div class="card" style="margin:0"><h3>Việt → Anh</h3><p class="ex">Xem nghĩa, tự gõ từ tiếng Anh.</p><button class="btn pri" data-act="start" data-m="vi-en">Bắt đầu</button></div><div class="card" style="margin:0"><h3>Anh → Việt</h3><p class="ex">Xem từ, tự nhập nghĩa tiếng Việt.</p><button class="btn pri" data-act="start" data-m="en-vi">Bắt đầu</button></div><div class="card" style="margin:0"><h3>Flashcard</h3><p class="ex">Lật thẻ, đánh dấu đã thuộc.</p><button class="btn pri" data-act="start" data-m="card">Bắt đầu</button></div><div class="card" style="margin:0"><h3>Trắc nghiệm</h3><p class="ex">Chọn 1 trong 4 đáp án (phím 1–4).</p><button class="btn pri" data-act="start" data-m="mc">Bắt đầu</button></div><div class="card" style="margin:0"><h3>Điền từ thông minh</h3><p class="ex">AI viết câu mới, bạn gõ từ còn thiếu.</p><button class="btn pri" data-act="start" data-m="cloze">Bắt đầu</button></div><div class="card" style="margin:0"><h3>Asteroid</h3><p class="ex">Gõ từ để bắn hạ thiên thạch.</p><button class="btn pri" data-act="start" data-m="game">Chơi</button></div></div>`}
 if(P.loading)return '<div class="card empty">AI đang tạo câu cho bạn…</div>';if(P.mode==='game')return vGame();if(P.mode==='mc'&&P.i<P.queue.length)return vMC();if(P.mode==='card')return vCard();return vQuiz()}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA0G3dmtJYUQG11_iIZj_DCz_y_wX4Ayrw",
  authDomain: "huy-s-pro.firebaseapp.com",
  projectId: "huy-s-pro",

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SYNC_KEY = 'smartvocab_sync', DIRTY_KEY = 'smartvocab_dirty';
const LOCAL_ONLY = ['mode', 'key', 'model', 'proxy'];   // KHÔNG đưa lên cloud (có API key)
const getInfo = () => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } };
const setInfo = o => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(o)); } catch (e) {} };
const isDirty = () => localStorage.getItem(DIRTY_KEY) === '1';
const setDirty = v => { try { v ? localStorage.setItem(DIRTY_KEY, '1') : localStorage.removeItem(DIRTY_KEY); } catch (e) {} };

const btn = document.getElementById('acct');
let timer = null, busy = false;

/* ---------- Giao diện nút tài khoản ---------- */
function paintBtn(user) {
  btn.classList.toggle('pri', !user);
  if (!user) { btn.textContent = 'Đăng nhập Google'; btn.title = 'Đăng nhập để lưu dữ liệu lên tài khoản Google'; return; }
  const name = (user.displayName || user.email || '').split(' ').slice(-1)[0];
  btn.innerHTML = '';
  if (user.photoURL) { const im = document.createElement('img'); im.src = user.photoURL; im.alt = ''; im.referrerPolicy = 'no-referrer'; btn.appendChild(im); }
  const sp = document.createElement('span'); sp.className = 'nm'; sp.textContent = '☁ ' + name; btn.appendChild(sp);
  btn.title = 'Đã đăng nhập: ' + (user.email || '') + ' — bấm để đăng xuất';
}

/* ---------- Dữ liệu: tách / gộp ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
const wordCount = d => (d.decks || []).reduce((n, k) => n + (k.words || []).length, 0);
const isEmpty = d => wordCount(d) === 0 && !Object.keys(d.log || {}).length;
const freshData = () => ({ decks: [{ id: uid(), name: 'Bộ từ vựng của tôi', words: [] }], log: {}, set: { mode: 'gemini', key: '', model: 'gemini-2.0-flash', proxy: '' } });

function toCloud(d) {                 // bỏ API key / proxy trước khi đẩy lên
  const c = clone(d); c.set = c.set || {};
  LOCAL_ONLY.forEach(k => delete c.set[k]);
  return c;
}
function fromCloud(c) {               // giữ lại cấu hình AI riêng của máy này
  const r = clone(c); r.set = r.set || {};
  LOCAL_ONLY.forEach(k => { if (D.set && D.set[k] !== undefined) r.set[k] = D.set[k]; });
  if (r.set.mode === undefined) r.set.mode = 'gemini';
  if (r.set.key === undefined) r.set.key = '';
  if (r.set.model === undefined) r.set.model = 'gemini-2.0-flash';
  if (r.set.proxy === undefined) r.set.proxy = '';
  r.log = r.log || {};
  return r;
}
function merge(local, cloud) {        // gộp: bộ từ theo tên, từ theo chữ tiếng Anh
  const r = fromCloud(cloud);
  for (const ld of local.decks || []) {
    let rd = r.decks.find(x => x.name === ld.name);
    if (!rd) { r.decks.push(clone(ld)); continue; }
    for (const lw of ld.words || []) {
      const rw = rd.words.find(x => (x.en || '').toLowerCase() === (lw.en || '').toLowerCase());
      if (!rw) { rd.words.push(clone(lw)); continue; }
      const a = lw.st ? lw.st.c + lw.st.x : 0, b = rw.st ? rw.st.c + rw.st.x : 0;
      if (a > b) rw.st = clone(lw.st);
      if (lw.known && !rw.known) rw.known = true;
    }
  }
  for (const [day, l] of Object.entries(local.log || {})) {
    const c = r.log[day];
    if (!c) { r.log[day] = clone(l); continue; }
    if ((l.n || 0) > (c.n || 0)) { c.n = l.n; c.c = l.c; }
    c.ids = Array.from(new Set([...(c.ids || []), ...(l.ids || [])]));
  }
  return r;
}
function adopt(d) {                   // thay dữ liệu hiện tại, KHÔNG kích hoạt đẩy ngược lên cloud
  D = d;
  try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) {}
  if (S.deck && !D.decks.find(k => k.id === S.deck)) S.deck = null;
  render();
}

/* ---------- Đồng bộ ---------- */
const ref = () => doc(db, 'users', auth.currentUser.uid);

async function pushNow() {
  if (!auth.currentUser || busy) return;
  clearTimeout(timer); timer = null; busy = true;
  try {
    const json = JSON.stringify(toCloud(D));
    if (json.length > 950000) { toast('Dữ liệu quá lớn để đồng bộ (gần 1 MB). Hãy xuất JSON để sao lưu.', 5000); return; }
    const at = Date.now();
    await setDoc(ref(), { json, updatedAt: at });
    setInfo({ uid: auth.currentUser.uid, at });
    setDirty(false);
  } catch (e) {
    console.error('Sync lỗi:', e);
    toast('Chưa đồng bộ được lên tài khoản (sẽ thử lại lần lưu sau)');
  } finally { busy = false; }
}
window.cloudPush = () => {
  if (!auth.currentUser) return;
  clearTimeout(timer); timer = setTimeout(pushNow, 2000);
};

async function initialSync(user) {
  const info = getInfo();
  const snap = await getDoc(ref());
  const cloud = snap.exists() ? JSON.parse(snap.data().json) : null;
  const cloudAt = snap.exists() ? (snap.data().updatedAt || 0) : 0;
  let result = D, push = false, note = '';

  if (!cloud) {
    if (info.uid && info.uid !== user.uid) result = freshData();   // dữ liệu máy này thuộc tài khoản khác
    push = true;
  } else if (info.uid && info.uid !== user.uid) {
    result = fromCloud(cloud); note = 'Đã tải dữ liệu từ tài khoản';
  } else if (!info.uid) {                                          // lần đầu đăng nhập trên máy này
    if (isEmpty(D)) { result = fromCloud(cloud); note = 'Đã tải dữ liệu từ tài khoản'; }
    else { result = merge(D, cloud); push = true; note = 'Đã gộp dữ liệu máy này với tài khoản'; }
  } else if (cloudAt > info.at) {                                  // cloud mới hơn
    if (isDirty()) { result = merge(D, cloud); push = true; note = 'Đã gộp thay đổi từ thiết bị khác'; }
    else { result = fromCloud(cloud); note = 'Đã cập nhật từ thiết bị khác'; }
  } else { push = isDirty(); }

  if (result !== D) adopt(result);
  if (push) { await pushNow(); }
  else setInfo({ uid: user.uid, at: Math.max(cloudAt, info.at || 0) });
  if (note) toast('☁ ' + note);
  else toast('☁ Đã đăng nhập: ' + (user.email || ''));
}

async function pullIfNewer() {        // khi quay lại tab, lấy bản mới từ thiết bị khác
  const user = auth.currentUser; if (!user || busy || isDirty()) return;
  if (S.view === 'practice' && S.P) return;                        // không làm gián đoạn đang luyện tập
  try {
    const snap = await getDoc(ref()); if (!snap.exists()) return;
    const at = snap.data().updatedAt || 0, info = getInfo();
    if (at > (info.at || 0)) {
      adopt(fromCloud(JSON.parse(snap.data().json)));
      setInfo({ uid: user.uid, at });
      toast('☁ Đã cập nhật từ thiết bị khác');
    }
  } catch (e) { console.error(e); }
}

/* ---------- Sự kiện ---------- */
btn.addEventListener('click', async () => {
  if (location.protocol === 'file:') {
    return toast('Đăng nhập Google không chạy khi mở file trực tiếp. Hãy đưa web lên http(s) hoặc chạy localhost.', 5000);
  }
  const user = auth.currentUser;
  if (!user) {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) {
      if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
      if (e.code === 'auth/unauthorized-domain') toast('Tên miền này chưa được thêm vào Authorized domains trong Firebase.', 6000);
      else toast('Đăng nhập thất bại: ' + (e.code || e.message), 5000);
    }
  } else if (confirm('Đăng xuất khỏi ' + (user.email || 'tài khoản') + '?\n\nDữ liệu vẫn nằm trong tài khoản, đăng nhập lại là có.')) {
    if (isDirty()) await pushNow();
    await signOut(auth);
  }
});

onAuthStateChanged(auth, async user => {
  paintBtn(user);
  if (user) {
    btn.classList.add('sync');
    try { await initialSync(user); } catch (e) { console.error(e); toast('Không tải được dữ liệu từ tài khoản: ' + (e.code || e.message), 5000); }
    btn.classList.remove('sync');
  }
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { if (timer && auth.currentUser) pushNow(); }
  else pullIfNewer();
});
window.addEventListener('pagehide', () => { if (timer && auth.currentUser) pushNow(); });
</script>
